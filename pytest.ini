[pytest]
testpaths = MicroServices/Lead_Manager/tests MicroServices/SDR/tests MicroServices/Voice_Agent/tests MicroServices/leadfinder/tests business_analysis_agent/tests services/gmail_pubsub_listener/tests MicroServices/prompt_generation_agent/tests tests
norecursedirs = MicroServices/UI .* build dist
pythonpath = . MicroServices MicroServices/leadfinder business_analysis_agent
markers =
    integration: mark test as integration test requiring external services like Ollama
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:Warning

